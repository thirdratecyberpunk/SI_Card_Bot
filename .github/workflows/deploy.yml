name: Build & Deploy to EC2 (via ECR)

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push image
        run: |
          REPO="${{ secrets.ECR_REPOSITORY }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$REPO:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "$IMAGE_URI" > image_uri.txt

      - name: Upload image URI
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Read image URI
        run: |
          IMAGE_URI=$(cat image_uri.txt)
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # Turns the commits pushed to main into the JSON body the bot's
      # /webhook/deploy endpoint expects. Built from an env var (not
      # interpolated straight into the script) so a commit message can't
      # break out into shell.
      - name: Build changelog payload
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          echo "$COMMITS_JSON" | jq '{changes: [.[] | (.message | split("\n")[0]) + " (" + .author.name + ")"]}' > changes.json
          cat changes.json

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy changelog payload to EC2
        run: |
          scp -i ~/.ssh/id_rsa changes.json ubuntu@${{ secrets.EC2_HOST }}:/tmp/si-card-bot-changes.json

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} \
            IMAGE_URI="$IMAGE_URI" \
            DEPLOY_WEBHOOK_SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            'bash -s' <<'EOF'
          set -euo pipefail

          echo "Deploying $IMAGE_URI"

          cd ~/SI_Card_Bot

          # Ensure .env exists
          sudo touch .env

          # Remove any existing IMAGE_URI line
          sudo sed -i '/^IMAGE_URI=/d' .env

          # Append the new IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" | sudo tee -a .env

          ACCOUNT_ID=$(echo "$IMAGE_URI" | cut -d'.' -f1)
          REGION="eu-west-2"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"

          echo "Logging into ECR: $REGISTRY"

          aws ecr get-login-password --region "$REGION" \
            | sudo docker login --username AWS --password-stdin "$REGISTRY"

          echo "Pulling image..."
          sudo docker compose pull si-card-bot

          echo "Starting containers..."
          sudo docker compose up -d --remove-orphans

          # Notify the bot of what changed so it can post to every server
          # it's in. The bot's port isn't published to the host (see
          # docker-compose.yml), so this runs from inside the container
          # itself via `docker compose exec`. Best-effort: a failure here
          # doesn't fail the deploy.
          echo "Notifying bot of changes..."
          sudo docker compose cp /tmp/si-card-bot-changes.json si-card-bot:/tmp/changes.json
          sudo docker compose exec -T -e DEPLOY_WEBHOOK_SECRET="$DEPLOY_WEBHOOK_SECRET" si-card-bot \
            node scripts/notifyDeploy.cjs /tmp/changes.json \
            || echo "Warning: failed to notify bot of changelog"
          rm -f /tmp/si-card-bot-changes.json
          EOF
