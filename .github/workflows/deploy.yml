name: Build & Deploy to EC2 (via ECR)

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to ECR
        id: push
        shell: bash
        run: |
          set -euo pipefail

          REPO="${{ secrets.ECR_REPOSITORY }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}"

          echo "Computed IMAGE_URI = $IMAGE_URI"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          # Write output AFTER docker build and push
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for SSH helper files, optional)
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to EC2
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          EC2_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
        run: |
          echo "Deploying IMAGE_URI=${IMAGE_URI}"

          ssh -i ~/.ssh/id_rsa \
            $EC2_USER@${{ secrets.EC2_HOST }} \
            IMAGE_URI="${IMAGE_URI}" \
            'bash -s' << 'EOF'
          set -e

          echo "EC2 received IMAGE_URI=$IMAGE_URI"

          # Ensure docker is running
          sudo systemctl enable --now docker || true

          # Login to ECR using instance role
          if command -v aws >/dev/null 2>&1; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            aws ecr get-login-password --region '${{ secrets.AWS_REGION }}' \
              | sudo docker login --username AWS --password-stdin \
                "${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          fi

          # Pull the new image
          sudo docker pull "$IMAGE_URI"

          # Stop & remove old container (if exists)
          if sudo docker ps -a --format '{{.Names}}' | grep -q '^si-card-bot$'; then
            sudo docker stop si-card-bot || true
            sudo docker rm si-card-bot || true
          fi

          # Run container with env file
          sudo docker run -d --name si-card-bot --restart unless-stopped \
            --env-file ~/.env \
            "$IMAGE_URI"

          sudo docker logs --tail 50 si-card-bot || true
          EOF
