name: Build & Deploy to EC2 (via ECR)

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to ECR
        id: push
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ secrets.ECR_REPOSITORY }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${REPO}:${IMAGE_TAG}"
          echo "Computed IMAGE_URI = $IMAGE_URI"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "$IMAGE_URI" > image_uri.txt
      - name: Upload image URI
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Set image URI
        run: |
          IMAGE_URI=$(cat image_uri.txt)
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ secrets.EC2_SSH_USER || 'ubuntu' }}
        run: |
          echo "Deploying IMAGE_URI=${{ env.IMAGE_URI }}"

          ssh -i ~/.ssh/id_rsa \
            $EC2_USER@${{ secrets.EC2_HOST }} \
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            AWS_REGION=${{ secrets.AWS_REGION }} \
            IMAGE_URI="${{ env.IMAGE_URI }}" \
            'bash -s' << EOF
          set -euo pipefail

          echo "EC2 received IMAGE_URI=$IMAGE_URI"

          # Ensure consistent environment (fixes HOME issues)
          export HOME=/home/ubuntu

          # Derive registry directly from IMAGE_URI (no AWS call needed)
          REGISTRY="\${IMAGE_URI%%/*}"
          echo "Using registry: \$REGISTRY"

          # Ensure docker is running
          sudo systemctl enable --now docker || true

          # Move into the compose directory
          cd ~/SI_Card_Bot

          # Login to ECR
          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo docker login --username AWS --password-stdin "\$REGISTRY"

          # Pull latest image
          sudo docker compose pull si-card-bot

          # Start/update services
          sudo docker compose up -d

          EOF
