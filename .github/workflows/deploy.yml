name: Build & Deploy to EC2 (via ECR)

on:
  push:
    branches: [main]

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push image
        run: |
          REPO="${{ secrets.ECR_REPOSITORY }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          IMAGE_URI="$ACCOUNT_ID.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$REPO:${IMAGE_TAG}"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "$IMAGE_URI" > image_uri.txt

      - name: Upload image URI
        uses: actions/upload-artifact@v4
        with:
          name: image_uri
          path: image_uri.txt

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image_uri

      - name: Read image URI
        run: |
          IMAGE_URI=$(cat image_uri.txt)
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.EC2_HOST }} << EOF
            set -euo pipefail

            echo "Deploying $IMAGE_URI"

            cd ~/SI_Card_Bot

            aws ecr get-login-password --region eu-west-2 \
            | sudo docker login --username AWS --password-stdin 623027687009.dkr.ecr.eu-west-2.amazonaws.com

            docker compose pull si-card-bot
            docker compose up -d --remove-orphans
          EOF
